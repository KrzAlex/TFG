plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tfg.temieeg'
    compileSdk 34

    // Declarar el NDK permite a AGP encontrar llvm-strip y eliminar los simbolos de
    // depuracion de libmuse_android.so al empaquetar: 53,7 MB -> 6,7 MB por ABI.
    // Sin esta linea AGP no encuentra la herramienta y copia los .so sin estripar.
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId "com.tfg.temieeg"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // proguard-rules.pro ya conserva Temi SDK, LibMuse, OSC y coroutines.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // El robot y los moviles de destino son ARM: descartar x86/x86_64
            // (solo utiles para emuladores) evita duplicar la libreria nativa.
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
        debug {
            // Para móviles normales: src/debug/AndroidManifest.xml elimina
            // TemiSdkContentProvider para que la app no se mate sola.
        }
        temi {
            // Para el robot Temi. Hereda firma debug (instalable directamente).
            // NO existe src/temi/AndroidManifest.xml, así que TemiSdkContentProvider
            // se conserva y el SDK se inicializa correctamente en el robot.
            initWith debug
            // Temi es ARM: sin los ABI de emulador el APK del robot baja de ~213 MB
            // a la libreria nativa de una sola arquitectura.
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        // Necesario en AGP 8+: expone BuildConfig.DEBUG para hacer perezosos los
        // logs del camino caliente del EEG (se evalúan ~4 veces por segundo).
        buildConfig true
    }

    testOptions {
        unitTests {
            // Log.* y otros métodos de android.jar devuelven valores por defecto
            // en vez de lanzar en tests JVM puros (MentalStateProcessor, HeadGestureDetector).
            returnDefaultValues = true
            // Robolectric necesita recursos/manifest para las clases con Handler/Looper.
            includeAndroidResources = true
        }
    }
}

dependencies {
    // ------------- LibMuse SDK (Bluetooth directo, sin Mind Monitor) -------------
    // Coloca libmuse_android.aar en app/libs/
    // Fuente: https://github.com/choosemuse/LibMuseAndroid  →  app/libs/
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // ------------- Temi SDK -------------
    // Verificar última versión en https://github.com/robotemi/sdk
    implementation 'com.robotemi:sdk:1.131.1'

    // ------------- Kotlin & coroutines -------------
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ------------- AndroidX UI -------------
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ------------- ViewModel + LiveData -------------
    implementation 'androidx.activity:activity-ktx:1.8.0'   // by viewModels() en Activity
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // ------------- OSC (Mind Monitor vía WiFi — modo por defecto) -------------
    implementation 'com.illposed.osc:javaosc-core:0.4'

    // ------------- Visualización EEG (opcional) -------------
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ------------- Test (JVM unit tests) -------------
    testImplementation 'junit:junit:4.13.2'
    // Robolectric: framework Android en la JVM (Handler/Looper/SystemClock virtuales)
    // para testear MorseDecoder y EscapeRoomEngine sin dispositivo.
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
